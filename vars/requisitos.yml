---
# Tabela de pre-requisitos por quantidade de dispositivos apontados.
# max_dispositivos = limite superior da faixa (o servidor deve atender
# a faixa cujo max_dispositivos seja a menor >= quantidade informada).
tabela_requisitos:
  - max_dispositivos: 1000
    cpu_min: 4
    disco_min_gb: 40
    ram_min_gb: 12
  - max_dispositivos: 3000
    cpu_min: 8
    disco_min_gb: 80
    ram_min_gb: 16
  - max_dispositivos: 8000
    cpu_min: 8
    disco_min_gb: 120
    ram_min_gb: 24
  - max_dispositivos: 15000
    cpu_min: 12
    disco_min_gb: 180
    ram_min_gb: 40
  - max_dispositivos: 30000
    cpu_min: 16
    disco_min_gb: 240
    ram_min_gb: 64
  - max_dispositivos: 100000
    cpu_min: 24
    disco_min_gb: 500
    ram_min_gb: 124
